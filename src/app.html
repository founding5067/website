<!doctype html>
<!-- The initial data-theme seeds dark mode before any JavaScript runs, so the
page is never briefly un-themed on load. -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Renders the <head> content from <svelte:head> (title, description). -->
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <!-- Displays the page content in place: SvelteKit renders into this element. -->
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
