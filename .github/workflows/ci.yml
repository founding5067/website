# CI workflow for PRs
name: CI

on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install-cache
          key: bun-${{ hashFiles('**/package.json') }}-${{ hashFiles('**/bun.lock*') }}
          restore-keys: |
            bun-${{ hashFiles('**/package.json') }}-
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Lint and format check
        run: bun run format:check
      - name: Run tests
        run: bun run test
      - name: Build
        run: bun run build
